name: Build Kernel for Samsung F41

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches: [ main ]

env:
  KERNEL_SOURCE: https://github.com/neeleshhh03/android_kernel_samsung_universal9611
  DEVICE_TREE: https://github.com/Parbindar7/android_device_samsung_f41
  ANDROID_VERSION: BP4A.251205.006

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout this repository
      uses: actions/checkout@v4
    
    - name: Setup Build Environment
      run: |
        echo "🔄 Setting up build environment..."
        sudo apt update
        sudo apt install -y git-core gnupg flex bison build-essential zip \
        curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
        lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
        libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 \
        python3-pip ccache bc libssl-dev libelf-dev libncurses-dev
        
        # Verify installations
        python3 --version
        git --version
        ccache --version
        
        echo "✅ Environment setup complete"
    
    - name: Clone Kernel Source
      run: |
        echo "📥 Cloning kernel source from: $KERNEL_SOURCE"
        git clone --depth=1 $KERNEL_SOURCE kernel-source
        cd kernel-source
        echo "✅ Kernel source cloned"
        echo "Current directory: $(pwd)"
        ls -la
        
    - name: Clone Device Tree
      run: |
        echo "📥 Cloning device tree..."
        mkdir -p device-tree
        git clone --depth=1 $DEVICE_TREE device-tree
        echo "✅ Device tree cloned"
        ls -la device-tree/
        
    - name: Setup Toolchains
      run: |
        echo "🔧 Setting up toolchains..."
        
        # Clone Proton Clang
        git clone --depth=1 https://github.com/kdrag0n/proton-clang clang-toolchain
        echo "Clang version:"
        clang-toolchain/bin/clang --version || true
        
        # Clone GCC 4.9
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc-toolchain
        echo "GCC version:"
        gcc-toolchain/bin/aarch64-linux-android-gcc --version || true
        
        # Clone AnyKernel3 for packaging
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3
        
        echo "✅ Toolchains ready"
    
    - name: Prepare Kernel Configuration
      run: |
        echo "🔍 Preparing kernel configuration..."
        cd kernel-source
        
        # List available defconfigs
        echo "Available defconfigs in kernel source:"
        find arch/arm64/configs -name "*defconfig*" 2>/dev/null | head -20 || echo "No defconfigs found in arch/arm64/configs"
        
        # Check if device tree has defconfig
        if [ -f "../device-tree/defconfig" ]; then
          echo "📋 Found defconfig in device tree"
          mkdir -p arch/arm64/configs/vendor
          cp ../device-tree/defconfig arch/arm64/configs/vendor/f41_defconfig
          echo "✅ Copied device tree defconfig"
        else
          echo "ℹ️ No defconfig in device tree, will use kernel default"
        fi
        
        # Create build directory
        mkdir -p out
        echo "Build directory created: out/"
        
    - name: Build Kernel
      run: |
        echo "🚀 Starting kernel build process..."
        cd kernel-source
        
        # Export build variables
        export ARCH=arm64
        export SUBARCH=arm64
        export PATH=$(pwd)/../clang-toolchain/bin:$PATH
        export PATH=$(pwd)/../gcc-toolchain/bin:$PATH
        export CROSS_COMPILE=aarch64-linux-android-
        export LLVM=1
        
        echo "Build variables:"
        echo "ARCH=$ARCH"
        echo "PATH=$PATH"
        echo "CROSS_COMPILE=$CROSS_COMPILE"
        
        # Clean previous builds
        echo "🧹 Cleaning previous builds..."
        make O=out clean 2>/dev/null || true
        make O=out mrproper 2>/dev/null || true
        
        # Try to find and use defconfig
        echo "🔧 Configuring kernel..."
        
        # List available defconfigs again
        echo "Available defconfigs:"
        ls arch/arm64/configs/*defconfig* 2>/dev/null | head -10 || echo "Checking in subdirectories..."
        find arch/arm64/configs -type f -name "*defconfig*" 2>/dev/null | head -10 || echo "No defconfigs found"
        
        # Try common defconfig names for Exynos 9611
        DEFCONFIG_CANDIDATES="vendor/f41_defconfig exynos9610_defconfig m20lte_defconfig universal9611_defconfig"
        
        for config in $DEFCONFIG_CANDIDATES; do
          if [ -f "arch/arm64/configs/$config" ]; then
            echo "✅ Found defconfig: $config"
            make O=out ARCH=arm64 $config
            echo "✅ Configuration applied: $config"
            CONFIG_USED="$config"
            break
          fi
        done
        
        if [ -z "$CONFIG_USED" ]; then
          echo "❌ No suitable defconfig found! Trying to list all..."
          find . -name "*defconfig*" -type f | head -20
          echo "⚠️ Using default configuration"
          # Try to proceed with default
        fi
        
        # Build the kernel
        echo "🔨 Building kernel with $(nproc) cores..."
        make -j$(nproc) O=out ARCH=arm64 2>&1 | tee build.log || {
          echo "❌ Build failed! Last 50 lines of log:"
          tail -50 build.log
          exit 1
        }
        
        # Check if kernel was built
        echo "📁 Checking build output..."
        if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
          echo "🎉 SUCCESS: Kernel image found!"
          echo "📊 File size: $(ls -lh out/arch/arm64/boot/Image.gz-dtb)"
          
          # Copy to AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb ../AnyKernel3/
          echo "✅ Kernel copied to AnyKernel3"
        elif [ -f "out/arch/arm64/boot/Image" ]; then
          echo "🎉 SUCCESS: Kernel image found (without dtb)!"
          cp out/arch/arm64/boot/Image ../AnyKernel3/
        else
          echo "❌ ERROR: No kernel image found in out/arch/arm64/boot/"
          echo "Listing contents:"
          ls -la out/arch/arm64/boot/ 2>/dev/null || echo "Boot directory doesn't exist"
          exit 1
        fi
        
        # Save build log
        cp build.log ../build-log.txt
        
    - name: Create Flashable ZIP
      run: |
        echo "📦 Creating flashable ZIP..."
        cd AnyKernel3
        
        # Check if kernel file exists
        if [ ! -f "Image.gz-dtb" ] && [ ! -f "Image" ]; then
          echo "❌ ERROR: No kernel file in AnyKernel3 directory!"
          ls -la
          exit 1
        fi
        
        # Create AnyKernel3 script
        cat > anykernel.sh << 'EOF'
        ## AnyKernel3 Ramdisk Mod Script
        ## osm0sis @ xda-developers
        
        ### AnyKernel setup
        properties() {
        kernel.string=F41-Kernel-Android16
        do.devicecheck=1
        do.modules=0
        do.systemless=1
        do.cleanup=1
        do.cleanuponabort=0
        device.name1=f41
        device.name2=m20lte
        supported.versions=16
        supported.patchlevels=
        }
        
        ### AnyKernel file attributes
        attributes() {
        set_perm_recursive 0 0 755 644 $ramdisk/*;
        set_perm_recursive 0 0 750 750 $ramdisk/init* $ramdisk/sbin;
        }
        
        ### AnyKernel install
        dump_boot() {
          ui_print " "
          ui_print "******************************"
          ui_print "  Samsung F41 Android 16 Kernel"
          ui_print "******************************"
          ui_print " "
        }
        
        write_boot() {
          ui_print " "
          ui_print "******************************"
          ui_print "    Flash completed!"
          ui_print "******************************"
          ui_print " "
        }
        
        ## End AnyKernel3
        EOF
        
        # Create README for the ZIP
        cat > README.md << 'EOF'
        # Samsung F41 Kernel - Android 16 QPR2
        
        ## Device: Samsung Galaxy F41
        ## Chipset: Exynos 9611
        ## Android: 16 QPR2 (BP4A.251205.006)
        
        ## Installation:
        1. Boot to TWRP/OrangeFox Recovery
        2. Flash this ZIP
        3. Wipe Dalvik/Cache
        4. Reboot
        
        ## Notes:
        - Built automatically via GitHub Actions
        - Source: ${{ env.KERNEL_SOURCE }}
        - Build Date: $(date)
        
        ⚠️ Flash at your own risk!
        EOF
        
        # Create ZIP file
        ZIP_NAME="F41-Kernel-Android16-$(date +%Y%m%d-%H%M).zip"
        echo "Creating ZIP: $ZIP_NAME"
        
        # Add files to ZIP (excluding git files)
        zip -r9 ../$ZIP_NAME . -x "*.git*" "*.gitignore" "*placeholder"
        
        echo "✅ ZIP created: $(ls -lh ../$ZIP_NAME)"
        
        # Move ZIP to artifacts folder
        mkdir -p ../artifacts
        mv ../$ZIP_NAME ../artifacts/
        mv ../build-log.txt ../artifacts/
        
        # Create a simple version file
        echo "Kernel Build Complete!" > ../artifacts/BUILD_INFO.txt
        echo "Date: $(date)" >> ../artifacts/BUILD_INFO.txt
        echo "GitHub Run: $GITHUB_RUN_ID" >> ../artifacts/BUILD_INFO.txt
    
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: f41-kernel-build
        path: |
          artifacts/
          kernel-source/out/arch/arm64/boot/
        retention-days: 7
        if-no-files-found: error
    
    - name: Success Notification
      if: success()
      run: |
        echo "========================================"
        echo "✅ BUILD SUCCESSFUL!"
        echo "========================================"
        echo "Kernel has been built and packaged"
        echo "Download from Artifacts section"
        echo "========================================"
    
    - name: Failure Notification
      if: failure()
      run: |
        echo "========================================"
        echo "❌ BUILD FAILED!"
        echo "========================================"
        echo "Check the logs above for errors"
        echo "Common issues:"
        echo "1. Defconfig not found"
        echo "2. Toolchain issues"
        echo "3. Missing dependencies"
        echo "========================================"
