name: Build Kernel for Samsung F41

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  KERNEL_SOURCE: https://github.com/neeleshhh03/android_kernel_samsung_universal9611
  DEVICE_TREE: https://github.com/Parbindar7/android_device_samsung_f41
  ANDROID_VERSION: BP4A.251205.006

jobs:
  build:
    runs-on: ubuntu-22.04  # Using 22.04 for compatibility
    
    steps:
    - name: Checkout this repo
      uses: actions/checkout@v3
      
    - name: Setup Build Environment
      run: |
        sudo apt update
        sudo apt install -y git-core gnupg flex bison build-essential zip \
        curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
        lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
        libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 \
        python3-pip ccache bc libssl-dev libelf-dev libncurses-dev
        
        ccache -M 10G
        echo "✅ Environment ready"
        
    - name: Clone Kernel Source
      run: |
        echo "📥 Cloning kernel source..."
        git clone --depth=1 $KERNEL_SOURCE -b android-16 kernel-source
        cd kernel-source
        echo "✅ Kernel source cloned"
        
    - name: Clone Device Tree
      run: |
        echo "📥 Cloning device tree..."
        git clone --depth=1 $DEVICE_TREE -b android-16 device-tree
        echo "✅ Device tree cloned"
        
    - name: Setup Toolchains
      run: |
        echo "🔧 Setting up toolchains..."
        
        # Clone Clang
        git clone --depth=1 https://github.com/kdrag0n/proton-clang clang
        
        # Clone GCC
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc
        
        # Clone AnyKernel3 for packaging
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3
        
        echo "✅ Toolchains ready"
        
    - name: Prepare Configuration
      run: |
        cd kernel-source
        
        # Create build directory
        mkdir -p out
        
        # Check available defconfigs
        echo "🔍 Available defconfigs:"
        find arch/arm64/configs -name "*defconfig*" | head -20 || true
        
        # Copy device tree defconfig if exists
        if [ -f "../device-tree/defconfig" ]; then
          echo "📋 Using device tree defconfig"
          mkdir -p arch/arm64/configs/vendor
          cp ../device-tree/defconfig arch/arm64/configs/vendor/f41_defconfig
        fi
        
    - name: Build Kernel
      run: |
        cd kernel-source
        
        # Export build variables
        export ARCH=arm64
        export SUBARCH=arm64
        export PATH=$(pwd)/../clang/bin:$PATH
        export PATH=$(pwd)/../gcc/bin:$PATH
        export CROSS_COMPILE=aarch64-linux-android-
        export LLVM=1
        
        # Clean
        make O=out clean && make O=out mrproper
        
        # Try different defconfig names
        echo "🔧 Looking for defconfig..."
        
        # Check what defconfigs exist
        DEFCONFIG_FOUND=$(find arch/arm64/configs -name "*defconfig" | head -5)
        echo "Found defconfigs: $DEFCONFIG_FOUND"
        
        # Try common defconfigs
        for config in vendor/f41_defconfig exynos9610_defconfig universal9611_defconfig; do
          if [ -f "arch/arm64/configs/$config" ]; then
            echo "✅ Using defconfig: $config"
            make O=out ARCH=arm64 $config
            break
          fi
        done
        
        # If no defconfig found, list all
        if [ ! -f "out/.config" ]; then
          echo "❌ No defconfig found. Listing all:"
          find arch/arm64/configs -type f -name "*config*"
          echo "Please specify correct defconfig name"
          exit 1
        fi
        
        # Build kernel
        echo "🚀 Starting kernel build..."
        make -j$(nproc) O=out ARCH=arm64
        
        # Check if build succeeded
        if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
          echo "🎉 Kernel build successful!"
          
          # Copy to AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb ../AnyKernel3/
        else
          echo "❌ Kernel image not found!"
          echo "Checking build output..."
          ls -la out/arch/arm64/boot/ || true
          exit 1
        fi
        
    - name: Create Flashable ZIP
      run: |
        cd AnyKernel3
        
        # Create AnyKernel script
        cat > anykernel.sh << 'EOF'
        # AnyKernel3 Script
        do.devicecheck=1
        do.modules=0
        do.systemless=1
        do.cleanup=1
        device.name1=f41
        device.name2=m20lte
        block=/dev/block/platform/13520000.ufs/by-name/BOOT;
        is_slot_device=0;
        . tools/ak3-core.sh;
        dump_boot;
        write_boot;
        EOF
        
        # Create zip
        ZIP_NAME="F41-Kernel-Android16-$(date +%Y%m%d-%H%M).zip"
        zip -r9 ../$ZIP_NAME . -x ".git*"
        
        # Move to artifacts
        mkdir -p ../artifacts
        mv ../$ZIP_NAME ../artifacts/
        echo "📦 Created: $ZIP_NAME"
        
    - name: Upload Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: kernel-package
        path: artifacts/
