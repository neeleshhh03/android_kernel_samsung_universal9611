name: Build Kernel for Samsung F41

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  KERNEL_SOURCE: https://github.com/Parbindar7/android_kernel_samsung_universal9611
  DEVICE_TREE: https://github.com/Parbindar7/android_device_samsung_f41
  ANDROID_VERSION: BP4A.251205.006

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout this repo
      uses: actions/checkout@v4
      
    - name: Check Available Branches
      run: |
        echo "🔍 Checking kernel source branches..."
        git ls-remote --heads $KERNEL_SOURCE
        
        echo ""
        echo "🔍 Checking device tree branches..."
        git ls-remote --heads $DEVICE_TREE
        
    - name: Setup Build Environment
      run: |
        sudo apt update
        sudo apt install -y git-core gnupg flex bison build-essential zip \
        curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
        lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
        libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 \
        python3-pip ccache bc libssl-dev libelf-dev libncurses-dev
        
        ccache -M 10G
        echo "✅ Environment ready"
        
    - name: Clone Kernel Source
      run: |
        echo "📥 Cloning kernel source..."
        
        # First try main branch (most common)
        git clone --depth=1 $KERNEL_SOURCE kernel-source || \
        git clone --depth=1 $KERNEL_SOURCE -b main kernel-source || \
        git clone --depth=1 $KERNEL_SOURCE -b master kernel-source || \
        git clone --depth=1 $KERNEL_SOURCE -b android-14 kernel-source || \
        git clone --depth=1 $KERNEL_SOURCE -b android-13 kernel-source
        
        cd kernel-source
        echo "✅ Kernel source cloned"
        echo "🌿 Current branch: $(git branch --show-current)"
        
    - name: Clone Device Tree
      run: |
        echo "📥 Cloning device tree..."
        
        # Try different branches
        git clone --depth=1 $DEVICE_TREE device-tree || \
        git clone --depth=1 $DEVICE_TREE -b main device-tree || \
        git clone --depth=1 $DEVICE_TREE -b master device-tree || \
        git clone --depth=1 $DEVICE_TREE -b android-14 device-tree
        
        echo "✅ Device tree cloned"
        
    - name: Setup Toolchains
      run: |
        echo "🔧 Setting up toolchains..."
        
        # Clone Clang
        git clone --depth=1 https://github.com/kdrag0n/proton-clang clang
        
        # Clone GCC
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc
        
        # Clone AnyKernel3 for packaging
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3
        
        echo "✅ Toolchains ready"
        
    - name: Debug - Check Kernel Structure
      run: |
        cd kernel-source
        echo "📁 Kernel source root:"
        ls -la
        echo ""
        echo "📁 Arch directory:"
        ls -la arch/
        echo ""
        echo "📁 ARM64 directory:"
        ls -la arch/arm64/ || echo "No arm64 directory"
        
    - name: Find Defconfig
      run: |
        cd kernel-source
        
        echo "🔍 Searching for defconfigs in arch/arm64/configs/..."
        if [ -d "arch/arm64/configs" ]; then
          echo "Available defconfigs:"
          ls -la arch/arm64/configs/
          echo ""
          echo "Looking for Exynos/Samsung defconfigs:"
          ls arch/arm64/configs/ | grep -i "exynos\|samsung\|9611\|9610\|f41\|m20" || echo "No matching defconfigs found"
        else
          echo "❌ arch/arm64/configs directory not found!"
          echo "Looking for configs anywhere..."
          find . -name "*defconfig*" -type f | head -20
        fi
        
    - name: Prepare Configuration
      run: |
        cd kernel-source
        
        # Create build directory
        mkdir -p out
        
        # Check if we found any defconfigs
        if [ -d "arch/arm64/configs" ]; then
          # List defconfigs and pick one
          DEFCONFIGS=$(ls arch/arm64/configs/ | head -10)
          echo "Available defconfigs: $DEFCONFIGS"
          
          # Try to find the right one
          for config in $DEFCONFIGS; do
            if [[ "$config" == *"exynos"* ]] || [[ "$config" == *"9611"* ]] || [[ "$config" == *"9610"* ]]; then
              DEFCONFIG="$config"
              echo "✅ Selected defconfig: $DEFCONFIG"
              break
            fi
          done
          
          # If no match, use the first one
          if [ -z "$DEFCONFIG" ] && [ -n "$DEFCONFIGS" ]; then
            DEFCONFIG=$(echo "$DEFCONFIGS" | head -1)
            echo "⚠️ Using first available defconfig: $DEFCONFIG"
          fi
        fi
        
        if [ -z "$DEFCONFIG" ]; then
          echo "❌ No defconfig found!"
          echo "Creating a minimal defconfig..."
          
          # Create a minimal defconfig
          mkdir -p arch/arm64/configs
          cat > arch/arm64/configs/f41_minimal_defconfig << 'EOF'
CONFIG_LOCALVERSION="-f41-android16"
CONFIG_AUDIT=y
CONFIG_NO_HZ=y
CONFIG_HIGH_RES_TIMERS=y
CONFIG_SMP=y
CONFIG_CPU_FREQ=y
CONFIG_CPU_IDLE=y
CONFIG_ARM64=y
CONFIG_ARCH_EXYNOS=y
CONFIG_SOC_EXYNOS9610=y
CONFIG_SOC_EXYNOS9611=y
EOF
          DEFCONFIG="f41_minimal_defconfig"
          echo "✅ Created minimal defconfig"
        fi
        
        echo "DEFCONFIG=$DEFCONFIG" >> $GITHUB_ENV
        echo "📋 Will use: $DEFCONFIG"
        
    - name: Build Kernel
      run: |
        cd kernel-source
        
        # Export build variables
        export ARCH=arm64
        export SUBARCH=arm64
        export PATH=$(pwd)/../clang/bin:$PATH
        export PATH=$(pwd)/../gcc/bin:$PATH
        export CROSS_COMPILE=aarch64-linux-android-
        export LLVM=1
        
        echo "🔧 Using defconfig: $DEFCONFIG"
        
        # Clean
        make O=out clean && make O=out mrproper
        
        # Apply defconfig
        make O=out ARCH=arm64 $DEFCONFIG
        
        # Show kernel version
        echo "📊 Kernel version:"
        make kernelversion || echo "Could not determine kernel version"
        
        # Build kernel
        echo "🚀 Starting kernel build..."
        
        # Build with more verbosity
        time make -j$(nproc) O=out ARCH=arm64 2>&1 | tee build.log
        
        # Check if build succeeded
        KERNEL_FILES="out/arch/arm64/boot/Image.gz-dtb out/arch/arm64/boot/Image"
        for file in $KERNEL_FILES; do
          if [ -f "$file" ]; then
            echo "🎉 Kernel build successful!"
            echo "📊 Build output: $file"
            ls -lh "$file"
            
            # Copy to AnyKernel3
            cp "$file" ../AnyKernel3/
            if [[ "$file" == *.gz-dtb ]]; then
              cp "$file" ../AnyKernel3/Image.gz-dtb
            else
              cp "$file" ../AnyKernel3/Image
            fi
            break
          fi
        done
        
        if [ ! -f "out/arch/arm64/boot/Image.gz-dtb" ] && [ ! -f "out/arch/arm64/boot/Image" ]; then
          echo "❌ Kernel image not found!"
          echo "Last 100 lines of build log:"
          tail -100 build.log
          echo ""
          echo "Checking output directory structure:"
          find out/ -type f -name "Image*" -o -name "*zImage*" -o -name "*kernel*" | head -20
          exit 1
        fi
        
    - name: Create Flashable ZIP
      run: |
        cd AnyKernel3
        
        # Check what kernel file we have
        echo "📁 AnyKernel3 contents before packaging:"
        ls -la
        
        # Create AnyKernel script
        cat > anykernel.sh << 'EOF'
        # AnyKernel3 Script for Samsung F41
        
        ## AnyKernel setup
        properties() {
        kernel.string=F41-Kernel-Android16
        do.devicecheck=1
        do.modules=0
        do.systemless=1
        do.cleanup=1
        device.name1=f41
        device.name2=m20lte
        '; }
        
        ## AnyKernel file attributes
        attributes() {
        set_perm_recursive 0 0 755 644 $ramdisk/*;
        set_perm_recursive 0 0 750 750 $ramdisk/init* $ramdisk/sbin;
        }
        
        ## AnyKernel install
        block=/dev/block/platform/13520000.ufs/by-name/BOOT;
        is_slot_device=0;
        ramdisk_compression=auto;
        
        . tools/ak3-core.sh;
        
        dump_boot;
        write_boot;
        EOF
        
        # Add version info
        echo "Samsung F41 Kernel" > README.md
        echo "Build Date: $(date)" >> README.md
        echo "Android Target: ${{ env.ANDROID_VERSION }}" >> README.md
        echo "Source: ${{ env.KERNEL_SOURCE }}" >> README.md
        
        # Create zip
        ZIP_NAME="F41-Kernel-$(date +%Y%m%d-%H%M).zip"
        zip -r9 ../$ZIP_NAME . -x ".git*" "*.gitignore"
        
        # Move to artifacts
        mkdir -p ../artifacts
        mv ../$ZIP_NAME ../artifacts/
        cp ../kernel-source/build.log ../artifacts/
        
        echo "📦 Created: artifacts/$ZIP_NAME"
        ls -lh ../artifacts/
        
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build-${{ github.run_number }}
        path: |
          artifacts/
        retention-days: 7
        
    - name: Show Success Message
      if: success()
      run: |
        echo "╔═══════════════════════════════════════╗"
        echo "║    ✅ KERNEL BUILD SUCCESSFUL!       ║"
        echo "╚═══════════════════════════════════════╝"
        echo ""
        echo "📱 Device: Samsung Galaxy F41"
        echo "🤖 Android: ${{ env.ANDROID_VERSION }}"
        echo "🔢 Build: #${{ github.run_number }}"
        echo ""
        echo "📥 Download:"
        echo "1. Go to Actions tab → This workflow run"
        echo "2. Scroll to 'Artifacts' section"
        echo "3. Download 'kernel-build-${{ github.run_number }}'"
        echo ""
        echo "⚡ Flash Instructions:"
        echo "1. Boot to TWRP/OrangeFox Recovery"
        echo "2. Flash the downloaded ZIP"
        echo "3. Wipe Dalvik/Cache"
        echo "4. Reboot"
        echo ""
        echo "⚠️ Warning: Flash at your own risk!"
        echo "Always backup your current kernel first."
