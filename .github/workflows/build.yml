name: Build Kernel for Samsung F41

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  KERNEL_SOURCE: https://github.com/neeleshhh03/android_kernel_samsung_universal9611
  DEVICE_TREE: https://github.com/Parbindar7/android_device_samsung_f41
  ANDROID_VERSION: BP4A.251205.006

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout this repo
      uses: actions/checkout@v4  # Updated to v4
      
    - name: Setup Build Environment
      run: |
        sudo apt update
        sudo apt install -y git-core gnupg flex bison build-essential zip \
        curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
        lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
        libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 \
        python3-pip ccache bc libssl-dev libelf-dev libncurses-dev
        
        ccache -M 10G
        echo "✅ Environment ready"
        
    - name: Clone Kernel Source
      run: |
        echo "📥 Cloning kernel source..."
        git clone --depth=1 $KERNEL_SOURCE -b android-16 kernel-source
        cd kernel-source
        echo "✅ Kernel source cloned"
        
    - name: Clone Device Tree
      run: |
        echo "📥 Cloning device tree..."
        git clone --depth=1 $DEVICE_TREE -b android-16 device-tree
        echo "✅ Device tree cloned"
        
    - name: Setup Toolchains
      run: |
        echo "🔧 Setting up toolchains..."
        
        # Clone Clang
        git clone --depth=1 https://github.com/kdrag0n/proton-clang clang
        
        # Clone GCC
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc
        
        # Clone AnyKernel3 for packaging
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3
        
        echo "✅ Toolchains ready"
        
    - name: Debug - Check Kernel Structure
      run: |
        cd kernel-source
        echo "📁 Kernel source structure:"
        ls -la
        echo ""
        echo "📁 Arch directory:"
        ls -la arch/
        echo ""
        echo "📁 ARM64 configs:"
        ls -la arch/arm64/configs/ || echo "No arm64/configs directory"
        
    - name: Find Defconfig
      run: |
        cd kernel-source
        
        # First, check what branch we're on
        echo "🌿 Current branch:"
        git branch -a
        
        # List ALL defconfigs
        echo "🔍 Searching for defconfigs..."
        find . -name "*defconfig*" -type f | head -20
        
        # Look for common Samsung/Exynos defconfigs
        echo "🔍 Looking for Samsung defconfigs..."
        find . -name "*samsung*" -name "*config*" -type f
        find . -name "*exynos*" -name "*config*" -type f
        find . -name "*9611*" -name "*config*" -type f
        find . -name "*f41*" -name "*config*" -type f
        
    - name: Prepare Configuration
      run: |
        cd kernel-source
        
        # Create build directory
        mkdir -p out
        
        # First check if device tree has defconfig
        if [ -f "../device-tree/defconfig" ]; then
          echo "📋 Using device tree defconfig"
          mkdir -p arch/arm64/configs/vendor
          cp ../device-tree/defconfig arch/arm64/configs/vendor/f41_defconfig
          DEFCONFIG="vendor/f41_defconfig"
        else
          # Try to find the right defconfig
          echo "🔍 Auto-detecting defconfig..."
          
          # Common defconfig names for Exynos 9611
          POSSIBLE_CONFIGS=(
            "exynos9610_defconfig"
            "universal9611_defconfig" 
            "exynos9611_defconfig"
            "m20lte_defconfig"
            "a50_defconfig"
            "samsung_defconfig"
          )
          
          for config in "${POSSIBLE_CONFIGS[@]}"; do
            if [ -f "arch/arm64/configs/$config" ]; then
              echo "✅ Found defconfig: $config"
              DEFCONFIG="$config"
              break
            fi
          done
          
          if [ -z "$DEFCONFIG" ]; then
            echo "❌ No defconfig found. Listing all available:"
            find arch/ -name "*defconfig" -type f
            exit 1
          fi
        fi
        
        echo "DEFCONFIG=$DEFCONFIG" >> $GITHUB_ENV
        
    - name: Build Kernel
      run: |
        cd kernel-source
        
        # Export build variables
        export ARCH=arm64
        export SUBARCH=arm64
        export PATH=$(pwd)/../clang/bin:$PATH
        export PATH=$(pwd)/../gcc/bin:$PATH
        export CROSS_COMPILE=aarch64-linux-android-
        export LLVM=1
        
        echo "🔧 Using defconfig: $DEFCONFIG"
        
        # Clean
        make O=out clean && make O=out mrproper
        
        # Apply defconfig
        make O=out ARCH=arm64 $DEFCONFIG
        
        # Show config summary
        echo "📋 Config summary:"
        grep "CONFIG_LOCALVERSION" out/.config || true
        
        # Build kernel
        echo "🚀 Starting kernel build..."
        time make -j$(nproc) O=out ARCH=arm64 2>&1 | tee build.log
        
        # Check if build succeeded
        if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
          echo "🎉 Kernel build successful!"
          echo "📊 Build size:"
          ls -lh out/arch/arm64/boot/Image.gz-dtb
          
          # Copy to AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb ../AnyKernel3/
        else
          echo "❌ Kernel image not found!"
          echo "Last 50 lines of build log:"
          tail -50 build.log
          echo ""
          echo "Checking output directory:"
          find out/ -name "Image*" -type f || true
          exit 1
        fi
        
    - name: Create Flashable ZIP
      run: |
        cd AnyKernel3
        
        # Create AnyKernel script
        cat > anykernel.sh << 'EOF'
        # AnyKernel3 Script
        # For Samsung Galaxy F41
        
        ## AnyKernel setup
        properties() {
        kernel.string=F41-Kernel-Android16
        do.devicecheck=1
        do.modules=0
        do.systemless=1
        do.cleanup=1
        device.name1=f41
        device.name2=m20lte
        supported.versions=16
        '; }
        
        ## AnyKernel file attributes
        attributes() {
        set_perm_recursive 0 0 755 644 $ramdisk/*;
        set_perm_recursive 0 0 750 750 $ramdisk/init* $ramdisk/sbin;
        }
        
        ## AnyKernel install
        block=/dev/block/platform/13520000.ufs/by-name/BOOT;
        is_slot_device=0;
        ramdisk_compression=auto;
        
        . tools/ak3-core.sh;
        
        dump_boot;
        write_boot;
        EOF
        
        # Add version info
        echo "Build Date: $(date)" > version.txt
        echo "Android: ${{ env.ANDROID_VERSION }}" >> version.txt
        echo "Source: ${{ env.KERNEL_SOURCE }}" >> version.txt
        
        # Create zip
        ZIP_NAME="F41-Kernel-Android16-$(date +%Y%m%d-%H%M).zip"
        zip -r9 ../$ZIP_NAME . -x ".git*" "*.gitignore"
        
        # Move to artifacts
        mkdir -p ../artifacts
        mv ../$ZIP_NAME ../artifacts/
        cp ../kernel-source/build.log ../artifacts/
        
        echo "📦 Created: artifacts/$ZIP_NAME"
        echo "📄 Build log: artifacts/build.log"
        
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4  # Updated to v4
      with:
        name: kernel-build-${{ github.run_number }}
        path: |
          artifacts/
          kernel-source/build.log
        retention-days: 7
        
    - name: Show Success Message
      if: success()
      run: |
        echo "========================================="
        echo "✅ KERNEL BUILD COMPLETED SUCCESSFULLY!"
        echo "========================================="
        echo ""
        echo "Download the kernel from:"
        echo "1. Go to Actions tab"
        echo "2. Click on this workflow run (#${{ github.run_number }})"
        echo "3. Scroll down to 'Artifacts' section"
        echo "4. Download 'kernel-build-${{ github.run_number }}'"
        echo ""
        echo "Flash instructions:"
        echo "1. Boot to TWRP/Recovery"
        echo "2. Flash the ZIP file"
        echo "3. Wipe Dalvik/Cache"
        echo "4. Reboot"
        echo "========================================="
