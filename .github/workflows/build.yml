name: Build Kernel for Samsung F41

on:
  push:
    branches: [ android-16 ]
  pull_request:
    branches: [ android-16 ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly builds
  workflow_dispatch:  # Manual trigger

env:
  KERNEL_VERSION: Android16-QPR2
  ANDROID_VERSION: BP4A.251205.006
  KERNEL_SOURCE: https://github.com/neeleshhh03/android_kernel_samsung_universal9611
  DEVICE_TREE: https://github.com/Parbindar7/android_device_samsung_f41
  BUILD_TYPE: userdebug

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
    - name: Checkout this repo
      uses: actions/checkout@v3
      with:
        path: build-scripts
    
    - name: Setup environment
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison build-essential zip \
        curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev \
        x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
        xsltproc unzip fontconfig python3 python3-pip ccache bc libssl-dev \
        libelf-dev libncurses-dev cpio rsync lz4 zstd
        
        # Setup Python
        pip3 install requests pyyaml
        
        # Setup ccache
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
        ccache -M 10G
        ccache -o compression=true
        echo "CCACHE_EXEC=$(which ccache)" >> $GITHUB_ENV
    
    - name: Clone kernel source
      run: |
        git clone --depth=1 $KERNEL_SOURCE -b android-16 kernel
        cd kernel
        echo "KERNEL_VERSION=$(make kernelversion)" >> $GITHUB_ENV
    
    - name: Clone device tree
      run: |
        git clone --depth=1 $DEVICE_TREE -b android-16 device/samsung/f41
        ls -la device/samsung/f41/
    
    - name: Setup toolchains
      run: |
        # Clone Proton Clang (modern Clang for Android 16)
        git clone --depth=1 https://github.com/kdrag0n/proton-clang clang
        
        # Clone AOSP GCC 4.9 (for compatibility)
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc-4.9
        
        # Clone AnyKernel3 for packaging
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3
        
        # Verify toolchains
        echo "Toolchain Setup Complete"
        clang/bin/clang --version
        gcc-4.9/bin/aarch64-linux-android-gcc --version
    
    - name: Prepare kernel configuration
      run: |
        cd kernel
        
        # Copy device tree defconfig if exists
        if [ -f "../device/samsung/f41/defconfig" ]; then
          mkdir -p arch/arm64/configs/vendor
          cp ../device/samsung/f41/defconfig arch/arm64/configs/vendor/f41_defconfig
          echo "Using device tree defconfig"
        else
          # Use existing defconfig from kernel source
          echo "Using kernel source defconfig"
        fi
        
        # Create build directory
        mkdir -p out
        
        # Extract kernel version
        KERNEL_VER=$(make kernelversion)
        echo "KERNEL_VERSION_FULL=${KERNEL_VER}" >> $GITHUB_ENV
    
    - name: Build kernel
      run: |
        cd kernel
        
        # Set environment variables
        export ARCH=arm64
        export SUBARCH=arm64
        export PATH=$(pwd)/../clang/bin:$PATH
        export PATH=$(pwd)/../gcc-4.9/bin:$PATH
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export LLVM=1
        export LLVM_IAS=1
        
        # Use ccache
        export CC="ccache clang"
        export LD=ld.lld
        
        # Clean previous builds
        make O=out clean
        make O=out mrproper
        
        # Use defconfig
        DEFCONFIG_FILE="vendor/f41_defconfig"
        if [ ! -f "arch/arm64/configs/$DEFCONFIG_FILE" ]; then
          DEFCONFIG_FILE="exynos9610_defconfig"  # Fallback for universal9611
        fi
        
        echo "Using defconfig: $DEFCONFIG_FILE"
        
        # Make config
        make O=out ARCH=arm64 $DEFCONFIG_FILE
        
        # Build kernel with verbose logging
        make -j$(nproc) O=out ARCH=arm64 \
        CC="ccache clang" \
        CROSS_COMPILE=aarch64-linux-android- \
        CROSS_COMPILE_ARM32=arm-linux-androideabi- \
        CLANG_TRIPLE=aarch64-linux-gnu- \
        LD=ld.lld \
        AR=llvm-ar \
        NM=llvm-nm \
        OBJCOPY=llvm-objcopy \
        OBJDUMP=llvm-objdump \
        STRIP=llvm-strip 2>&1 | tee build.log
        
        # Check if build was successful
        if [ -f "out/arch/arm64/boot/Image" ] || [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
          echo "✅ Kernel build successful!"
          
          # Copy kernel image
          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp out/arch/arm64/boot/Image.gz-dtb ../AnyKernel3/
            KERNEL_IMAGE="Image.gz-dtb"
          else
            cp out/arch/arm64/boot/Image ../AnyKernel3/Image
            KERNEL_IMAGE="Image"
          fi
          
          echo "KERNEL_IMAGE=$KERNEL_IMAGE" >> $GITHUB_ENV
        else
          echo "❌ Kernel build failed!"
          echo "Build log tail:"
          tail -100 build.log
          exit 1
        fi
    
    - name: Create flashable zip
      run: |
        cd AnyKernel3
        
        # Create AnyKernel3 script
        cat > anykernel.sh << 'EOF'
        # AnyKernel3 Ramdisk Mod Script
        # osm0sis @ xda-developers
        
        ## AnyKernel setup
        properties() { '
        kernel.string=F41-Kernel-Android16
        do.devicecheck=1
        do.modules=0
        do.systemless=1
        do.cleanup=1
        do.cleanuponabort=0
        device.name1=f41
        device.name2=m20lte
        supported.versions=16
        supported.patchlevels=
        '; }
        
        ## AnyKernel file attributes
        attributes() {
        set_perm_recursive 0 0 755 644 $ramdisk/*;
        set_perm_recursive 0 0 750 750 $ramdisk/init* $ramdisk/sbin;
        }
        
        ## AnyKernel install
        block=/dev/block/platform/13520000.ufs/by-name/BOOT;
        is_slot_device=0;
        ramdisk_compression=auto;
        
        . tools/ak3-core.sh;
        
        dump_boot;
        write_boot;
        EOF
        
        # Create version file
        echo "Kernel Version: ${{ env.KERNEL_VERSION_FULL }}" > version.txt
        echo "Android Version: ${{ env.ANDROID_VERSION }}" >> version.txt
        echo "Build Date: $(date)" >> version.txt
        echo "Build Type: ${{ env.BUILD_TYPE }}" >> version.txt
        
        # Create zip
        ZIP_NAME="F41-Kernel-Android16-QPR2-$(date +%Y%m%d-%H%M).zip"
        zip -r9 ../$ZIP_NAME . -x ".git*" "*.gitignore"
        
        # Move to artifacts folder
        mkdir -p ../artifacts
        mv ../$ZIP_NAME ../artifacts/
        cp ../kernel/build.log ../artifacts/
        
        echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: kernel-build-${{ github.run_number }}
        path: |
          artifacts/
          kernel/build.log
        retention-days: 7
    
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/*.zip
          kernel/out/arch/arm64/boot/Image*
        body: |
          # Samsung F41 Kernel - Android 16 QPR2
          
          **Build Details:**
          - Kernel Version: ${{ env.KERNEL_VERSION_FULL }}
          - Android Version: ${{ env.ANDROID_VERSION }}
          - Build Date: $(date)
          - GitHub Run: ${{ github.run_number }}
          
          **Sources:**
          - Kernel: https://github.com/neeleshhh03/android_kernel_samsung_universal9611
          - Device Tree: https://github.com/Parbindar7/android_device_samsung_f41
          
          **Installation:**
          1. Download the zip file
          2. Boot to TWRP/Recovery
          3. Flash the zip
          4. Wipe Dalvik/Cache
          5. Reboot
          
          **Build Logs:** [View](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
    
    - name: Notify Discord on Success
      if: success()
      uses: Ilshidur/action-discord@master
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      with:
        args: '✅ **Kernel Build Successful!**\n\n**Device:** Samsung F41\n**Version:** Android 16 QPR2\n**Build:** ${{ github.run_number }}\n\nDownload: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
    
    - name: Notify Discord on Failure
      if: failure()
      uses: Ilshidur/action-discord@master
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      with:
        args: '❌ **Kernel Build Failed!**\n\n**Device:** Samsung F41\n**Error:** Check logs\n\nDetails: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
